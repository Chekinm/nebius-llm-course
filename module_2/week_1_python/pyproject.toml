[project]
name = "week-1-python"
version = "0.1.0"
description = "N-gram Language Models with NLTK — pure Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dill>=0.4.0",
    "nltk>=3.9.0",
    "pandas>=3.0.0",
    "requests>=2.32.0",
]

[project.scripts]
ngram-lm = "ngram_lm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ngram_lm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
